name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16.15.1

      - name: Install dependencies from yarn.lock
        run: yarn --frozen-lockfile

      - name: Build (rollup dists + declaration types)
        run: npm run build

      - name: Emit src/*.js, src/*.js.map and src/*.d.ts with TypeScript 4.8.4
        run: |
          npm i --no-save --prefix /tmp/tsc484 typescript@4.8.4
          /tmp/tsc484/node_modules/.bin/tsc -p tsconfig.json

      - name: Pack tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: sift-*.tgz
          if-no-files-found: error
